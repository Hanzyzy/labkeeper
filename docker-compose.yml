version: '3.8'

services:
  labkeeper:
    build: .
    container_name: labkeeper_app
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./static/uploads:/app/static/uploads
      - ./static/qr_codes:/app/static/qr_codes
    environment:
      - PORT=5000
      - SECRET_KEY=labkeeper-super-secret-production-key-2026
